services:
  postgres:
    image: postgres:17-alpine
    container_name: eventos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventos
    ports:
      # Exposed on the host so the API can run outside the container
      # against the same database.
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d confirms the application database exists, not just the server.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eventos']
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco exclusivo da suíte de testes, em outra porta e com profile próprio:
  # `docker compose up` não sobe este serviço, só `--profile test` sobe. A
  # suíte trunca as tabelas a cada teste, e isso não pode acontecer no banco
  # de desenvolvimento.
  postgres-test:
    image: postgres:17-alpine
    container_name: eventos-postgres-test
    profiles: ['test']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventos_test
    ports:
      - '5433:5432'
    # Sem volume: o banco de teste é descartável de propósito.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eventos_test']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Root context: the Dockerfile needs the workspace manifests.
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eventos-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      TZ: UTC
      # Host is the service name: inside the Compose network `localhost`
      # would point at the API container itself.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eventos?schema=public
      JWT_SECRET: ${JWT_SECRET:-segredo-de-desenvolvimento-trocar-em-producao}
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        # Waits for the healthcheck, not just for the container to exist.
        condition: service_healthy

volumes:
  postgres-data:
